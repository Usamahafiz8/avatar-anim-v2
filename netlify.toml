# The 3D assets are not in the repo — Ready Player Me's animation-library
# licence forbids redistributing the animations, and this repo is public.
# So we download them at BUILD time instead: they end up in the deploy and are
# served as part of the app (the licensed use), without ever being committed.
[build]
  command = "node fetch-assets.mjs"
  publish = "."

[build.environment]
  NODE_VERSION = "20"

[functions]
  directory = "netlify/functions"

# Real AI vision analysis of selfie photos (see analyze-face-core.mjs) — needs
# ANTHROPIC_API_KEY set in the Netlify site's environment variables. Without
# it the function returns an error and index.html falls back to its local,
# free, offline heuristic detection automatically; nothing breaks either way.
# Client code calls the plain "/analyze-face" path so it works identically
# across Netlify, Vercel, and local dev (see vercel.json / serve.mjs).
[[redirects]]
  from = "/analyze-face"
  to = "/.netlify/functions/analyze-face"
  status = 200

# GLB is not in Netlify's default type map; without this the browser gets
# application/octet-stream, which still loads but is worth setting correctly.
[[headers]]
  for = "/models/*"
  [headers.values]
    Content-Type = "model/gltf-binary"
    Cache-Control = "public, max-age=31536000, immutable"
